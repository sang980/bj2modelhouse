<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웹 모델하우스 · 타입 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--ink:#1f2a33;--muted:#6b737a;--line:#e3dfd8;--accent:#35577a;--accent-soft:#e3ebf3;--display:"IBM Plex Sans KR","Noto Sans KR",sans-serif;--body:"Noto Sans KR",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1d2125;--ink:#e9ecef;--muted:#9aa3ab;--line:#2c3237;--accent:#8fb4d8;--accent-soft:#22303d}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1d2125;--ink:#e9ecef;--muted:#9aa3ab;--line:#2c3237;--accent:#8fb4d8;--accent-soft:#22303d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
main{max-width:980px;margin:0 auto;padding:56px 16px 40px}
header{margin-bottom:32px}
.eyebrow{font:500 13px var(--body);letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h1{font:600 clamp(26px,5vw,40px)/1.15 var(--display);margin:0 0 10px;letter-spacing:-.02em}
.lead{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;min-height:188px}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.08)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.type{font:600 44px/1 var(--display);letter-spacing:-.03em;color:var(--accent)}
.name{font:500 15px var(--body)}
.meta{font-size:13px;color:var(--muted);line-height:1.55;margin-top:auto}
.tag{align-self:flex-start;font:600 12px var(--body);padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.card.soon .type{color:var(--muted)}
.card.soon .tag{background:transparent;border:1px solid var(--line);color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.6}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;transition:opacity .2s ease,transform .2s ease;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<main>
  <header>
    <p class="eyebrow">신혼희망타운 · 웹 모델하우스</p>
    <h1>둘러볼 타입을 선택하세요</h1>
    <p class="lead">타입을 고르면 3D 세대 안으로 들어가 1인칭으로 걸어 다니며 볼 수 있습니다.</p>
  </header>
  <section class="grid" aria-label="세대 타입">
    <a class="card" href="55a.html"><span class="type">55A</span><span class="name">55A 타입</span><span class="tag">입장하기</span><span class="meta">전용 55.97㎡<br>침실2 · 알파룸 · 드레스룸</span></a>
    <a class="card" href="55b.html"><span class="type">55B</span><span class="name">55B 타입</span><span class="tag">입장하기</span><span class="meta">전용 55.97㎡<br>침실2 · 알파룸 · 드레스룸</span></a>
    <a class="card" href="55c.html"><span class="type">55C</span><span class="name">55C 타입</span><span class="tag">입장하기</span><span class="meta">전용 55.98㎡<br>측세대 · 드레스룸 창</span></a>
    <button class="card soon" type="button" data-type="56T"><span class="type">56T</span><span class="name">56T 테라스 타입</span><span class="tag">준비 중</span><span class="meta">테라스형</span></button>
  </section>
  <footer>평면도 치수 기반의 데모입니다. 실제 시공과 다를 수 있습니다.</footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const toast = document.getElementById('toast'); let tt = 0;
document.querySelectorAll('.card.soon').forEach(b => b.addEventListener('click', () => {
  const msg = b.dataset.type + ' 타입은 준비 중입니다.';
  alert(msg);
}));
</script>

</html>
